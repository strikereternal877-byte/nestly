name: nestly

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nestly
      POSTGRES_USER: nestly
      POSTGRES_PASSWORD: nestly_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestly -d nestly"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  consumer-api:
    build:
      context: .
      dockerfile: backend/consumer-api/ConsumerApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=nestly;Username=nestly;Password=nestly_dev
      Cache__ConnectionString: redis:6379
    ports:
      - "5257:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-api:
    build:
      context: .
      dockerfile: backend/admin-api/AdminApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=nestly;Username=nestly;Password=nestly_dev
      Cache__ConnectionString: redis:6379
    ports:
      - "5177:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  provider-api:
    build:
      context: .
      dockerfile: backend/provider-api/ProviderApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=nestly;Username=nestly;Password=nestly_dev
      Cache__ConnectionString: redis:6379
    ports:
      - "5337:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
