# Production-shaped compose manifest for running Nestly's backend APIs on a
# remote Docker host (staging or production), driven by the CD workflows in
# .github/workflows/cd-staging.yml and cd-production.yml.
#
# This is deliberately NOT the same file as the repo-root docker-compose.yml:
# that one is for local development and *builds* images from source; this
# one only ever *pulls* pre-built images that the CD workflows already
# published to GHCR (docs/DEVOPS.md ENVIRONMENTS: "Same artifact/image is
# promoted across environments; only configuration differs").
#
# Deploy mechanics (see the `deploy` job in either CD workflow):
#   1. CI copies this file to <host>:/opt/nestly/docker-compose.yml over SSH.
#   2. CI SSHes in and runs, with CONSUMER_API_IMAGE / ADMIN_API_IMAGE /
#      PROVIDER_API_IMAGE exported for the tag just built:
#        docker compose pull && docker compose up -d --remove-orphans
#
# Everything below is a template, not live infrastructure - there is no real
# staging/production host yet (docs/DEVOPS.md OPEN DECISIONS: cloud
# provider/registry/orchestrator unresolved). Before the first real deploy,
# whoever provisions the target host must:
#   - install Docker + the docker compose plugin
#   - create /opt/nestly/ owned by the SSH deploy user
#   - place a `.env` file next to this one (NOT committed - docs/DEVOPS.md
#     CONFIGURATION AND SECRETS: "Secrets... must come from a secret store -
#     never from source code or images") providing at minimum:
#       DATABASE_CONNECTION_STRING   Npgsql connection string for a managed
#                                     Postgres instance (NOT a local
#                                     container - staging/production use
#                                     managed services per DEVOPS.md)
#       REDIS_CONNECTION_STRING      host:port for a managed Redis instance
#       ASPNETCORE_ENVIRONMENT       Staging | Production
#     plus whatever strongly-typed config sections the APIs already expect
#     for JWT signing keys, payment gateway keys, and SMS/email provider
#     keys (see backend/*/appsettings.*.json for the section shapes - none
#     of those files contain secret values, only structure/defaults).
#
# CONSUMER_API_IMAGE / ADMIN_API_IMAGE / PROVIDER_API_IMAGE are exported by
# the CD workflow's SSH deploy step for the specific tag being deployed (or
# rolled back to); they are required here rather than defaulted so a missing
# export fails loudly instead of silently reusing whatever was running.

name: nestly

services:
  consumer-api:
    image: ${CONSUMER_API_IMAGE:?CONSUMER_API_IMAGE is required, e.g. ghcr.io/OWNER/REPO/consumer-api:staging-abc1234}
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING:?DATABASE_CONNECTION_STRING is required}
      Cache__ConnectionString: ${REDIS_CONNECTION_STRING:?REDIS_CONNECTION_STRING is required}
    ports:
      - "5257:8080"
    restart: unless-stopped

  admin-api:
    image: ${ADMIN_API_IMAGE:?ADMIN_API_IMAGE is required, e.g. ghcr.io/OWNER/REPO/admin-api:staging-abc1234}
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING:?DATABASE_CONNECTION_STRING is required}
      Cache__ConnectionString: ${REDIS_CONNECTION_STRING:?REDIS_CONNECTION_STRING is required}
    ports:
      - "5177:8080"
    restart: unless-stopped

  provider-api:
    image: ${PROVIDER_API_IMAGE:?PROVIDER_API_IMAGE is required, e.g. ghcr.io/OWNER/REPO/provider-api:staging-abc1234}
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING:?DATABASE_CONNECTION_STRING is required}
      Cache__ConnectionString: ${REDIS_CONNECTION_STRING:?REDIS_CONNECTION_STRING is required}
    ports:
      - "5377:8080"
    restart: unless-stopped
