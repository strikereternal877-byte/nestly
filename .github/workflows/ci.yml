name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nestly_test
          POSTGRES_USER: nestly
          POSTGRES_PASSWORD: nestly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nestly -d nestly_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Nestly.sln

      - name: Build
        run: dotnet build Nestly.sln --no-restore --configuration Release /warnaserror

      - name: Test
        env:
          ConnectionStrings__Database: Host=localhost;Port=5432;Database=nestly_test;Username=nestly;Password=nestly_test
        run: |
          if ls backend/**/*Tests*.csproj >/dev/null 2>&1 || ls backend/tests/**/*.csproj >/dev/null 2>&1; then
            dotnet test Nestly.sln --no-build --configuration Release --verbosity normal
          else
            echo "No test projects yet (first suite lands with T035)."
          fi

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    strategy:
      # Task #366: provider-web was missing here entirely and got no CI check
      # at all. Every app under frontend/ belongs in this matrix - the list is
      # the whole frontend/ directory, not a subset anyone has to remember to
      # extend.
      matrix:
        app: [customer-web, admin-web, provider-web]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install
        working-directory: frontend/${{ matrix.app }}
        run: |
          if [ -f package.json ]; then npm ci; else echo "App not scaffolded yet"; fi

      - name: Lint
        working-directory: frontend/${{ matrix.app }}
        run: |
          if [ -f package.json ]; then npm run lint --if-present; fi

      - name: Build
        working-directory: frontend/${{ matrix.app }}
        run: |
          if [ -f package.json ]; then npm run build --if-present; fi

  lighthouse-mobile:
    # Task #350: mobile Core Web Vitals budget gate for customer-web's top 3
    # funnel pages (home, service detail, checkout). A regression here fails
    # the build, same as the other jobs in this file.
    #
    # WHAT THIS DOES AND DOES NOT MEASURE (read before trusting this gate):
    # Home, service detail and checkout all fetch live data from consumer-api
    # at render time — auditing them against mocked/stubbed responses would
    # risk a budget that "passes" a page that actually 500s or renders empty
    # against the real API, which defeats the point of a regression gate. So
    # this job stands up a real consumer-api + admin-api + Postgres (mirroring
    # the `backend` job's service containers) and seeds one real
    # category/service/address/customer session through those APIs — reusing
    # `e2e/setup/seed-catalog.ts`, the same seeding the 140a-140d Playwright
    # E2E suite already uses, not a new/duplicate seeding path — before
    # building and starting customer-web against it. Checkout
    # (`/booking/summary`) is behind the app's client-side auth guard, so a
    # `puppeteerScript` (`frontend/customer-web/lighthouse/auth-setup.js`)
    # seeds a real logged-in session (from that same seed step's real
    # POST /auth/login/password call) before each audit.
    # What this still does NOT cover: production network topology (CDN,
    # regional latency), a warm cache / repeat-visit scenario, or realistic
    # concurrent load on consumer-api — it is one cold page load per URL
    # against a lightly-loaded single-instance API on the same runner.
    # See `frontend/customer-web/lighthouserc.js`'s header comment for the
    # metric definitions (in particular: INP has no lab equivalent in a
    # plain navigation audit, so Total Blocking Time is budgeted as its
    # documented proxy — this is not a mislabeled INP number).
    name: Mobile perf budget (customer-web)
    runs-on: ubuntu-latest
    needs: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Matches docker-compose.yml / appsettings.Development.json's
          # baked-in dev defaults exactly, so consumer-api/admin-api need no
          # ConnectionStrings override below (deliberately not reusing the
          # `backend` job's nestly_test/nestly_test credentials — this job
          # runs the apps themselves, in Development mode, the same way
          # e2e/README.md's manual setup does).
          POSTGRES_DB: nestly
          POSTGRES_USER: nestly
          POSTGRES_PASSWORD: nestly_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nestly -d nestly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/customer-web/package-lock.json

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome

      - name: Restore backend
        run: dotnet restore Nestly.sln

      - name: Build backend
        run: dotnet build Nestly.sln --no-restore --configuration Release

      - name: Apply database migrations
        run: |
          dotnet tool restore
          bash database/scripts/apply-migrations.sh

      - name: Seed dev admin + customer accounts
        run: |
          psql "postgresql://nestly:nestly_dev@localhost:5432/nestly" -f database/seed/dev-admin-seed.sql
          psql "postgresql://nestly:nestly_dev@localhost:5432/nestly" -f database/seed/dev-customer-seed.sql

      - name: Start consumer-api and admin-api
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          set -e
          dotnet run --project backend/consumer-api/ConsumerApi --no-build --configuration Release --urls http://localhost:5257 > consumer-api.log 2>&1 &
          dotnet run --project backend/admin-api/AdminApi --no-build --configuration Release --urls http://localhost:5177 > admin-api.log 2>&1 &

          for url in http://localhost:5257/health/ready http://localhost:5177/health/ready; do
            echo "Waiting for $url ..."
            for i in $(seq 1 60); do
              if curl -sf "$url" >/dev/null; then
                echo "$url is ready"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "$url did not become ready in time"
                cat consumer-api.log admin-api.log
                exit 1
              fi
              sleep 2
            done
          done

      - name: Install customer-web dependencies
        working-directory: frontend/customer-web
        run: npm ci

      - name: Seed catalog fixture (real service slug + customer session)
        working-directory: frontend/customer-web
        run: npm run seed:ci

      - name: Read seeded fixture into env
        working-directory: frontend/customer-web
        run: |
          node -e "
            const f = require('./e2e/setup/fixture.json');
            const fs = require('fs');
            fs.appendFileSync(process.env.GITHUB_ENV,
              \`LHCI_SERVICE_SLUG=\${f.serviceSlug}\n\` +
              \`LHCI_CUSTOMER_TOKEN=\${f.customerAccessToken}\n\`
            );
          "
          # Access tokens are short-lived; give the LHCI collect run (three
          # runs per URL) comfortable headroom rather than the real expiry.
          echo "LHCI_CUSTOMER_TOKEN_EXPIRES=$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build customer-web
        working-directory: frontend/customer-web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5257
        run: npm run build

      - name: Start customer-web
        working-directory: frontend/customer-web
        run: |
          set -e
          npm run start -- -p 3000 > customer-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ >/dev/null; then
              echo "customer-web is ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "customer-web did not become ready in time"
              cat customer-web.log
              exit 1
            fi
            sleep 2
          done

      - name: Run Lighthouse mobile budget
        working-directory: frontend/customer-web
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npx lhci autorun --config=lighthouserc.js

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: frontend/customer-web/lhci-reports
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    # Task #385: the Playwright suites actually run here. Before this job they
    # existed (customer-web 5 specs, admin-web 4) and nothing invoked them -
    # the only browser job in this file was `lighthouse-mobile`, which measures
    # performance budgets, not behaviour. Every defect the 2026-08-18 QA sweep
    # and #374 found was found by a human driving a browser; this is what turns
    # that class of finding into a red build instead of a support ticket.
    #
    # WHY A MATRIX RATHER THAN ONE JOB RUNNING ALL THREE SUITES.
    # Each leg gets its own Postgres service container, so each suite starts
    # from a freshly migrated, freshly seeded database. That is not just tidy -
    # it is load-bearing. These suites are not self-cleaning: every
    # customer-web run creates a booking on `today + 2` and permanently
    # consumes a provider for that whole day, because the E2E slot window
    # ("E2E Anytime") spans 00:00-23:59 and BookingProviderAssignmentService's
    # double-booking guard is unconditional. Against a long-lived database the
    # suite therefore exhausts its own provider supply after enough runs and
    # starts failing with "No one's available for this slot" - a data
    # condition, not a regression. A per-leg database makes that impossible
    # here; see tasks.csv #394 for the local-development side of it.
    #
    # All three APIs start in every leg. provider-web genuinely needs all
    # three (admin-api seeds the catalog and assigns, consumer-api creates and
    # pays for the booking, provider-api is what the app talks to), and paying
    # that cost uniformly is worth more than three slightly different setups
    # that drift apart.
    #
    # ASPNETCORE_ENVIRONMENT=Development is required, not incidental: it
    # relaxes the RateLimiting overrides, sets the CORS origins each frontend
    # is served from, and maps provider-api's dev-only login endpoint, which
    # is the only way the provider suite can authenticate without a real OTP
    # (SandboxNotificationProvider never delivers one - PRODUCTION-READINESS.md
    # §2.2).
    name: E2E (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: backend

    strategy:
      fail-fast: false
      matrix:
        include:
          # customer-web is deliberately ABSENT, and this is the only thing in
          # this job that is not yet proven. Its suite is not green on any
          # environment it has been run in: it fails on the long-lived dev
          # database from the provider-supply exhaustion described above
          # (#394), and it also failed on an improvised fresh stack built to
          # test that theory - though that stack differed from this job's path
          # (next dev on a non-standard port, no `npm run seed:ci`), so those
          # failures are not evidence about customer-web itself either way.
          # Adding an unverified leg would put a red job on main on day one,
          # which is how a gate gets continue-on-error'd and stops being a
          # gate. Tracked as #395: run the suite against this job's exact
          # shape, fix what it finds, then add the leg back here. The
          # lighthouse-mobile job below already drives customer-web against a
          # fresh CI database, so the shape is expected to work.
          - app: admin-web
            port: 3001
          - app: provider-web
            port: 3002

    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Matches docker-compose.yml / appsettings.Development.json's dev
          # defaults exactly, so the APIs need no connection-string override -
          # same reasoning as the lighthouse-mobile job above.
          POSTGRES_DB: nestly
          POSTGRES_USER: nestly
          POSTGRES_PASSWORD: nestly_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nestly -d nestly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Build backend
        run: dotnet build Nestly.sln --configuration Release

      - name: Apply database migrations
        run: |
          dotnet tool restore
          bash database/scripts/apply-migrations.sh

      - name: Seed accounts, geography and provider capacity
        env:
          PGURL: postgresql://nestly:nestly_dev@localhost:5432/nestly
        run: |
          set -e
          # Order matters: providers must exist before the capacity seed gives
          # them service areas and skills, and the category-city mapping is
          # what makes the seeded catalog visible in E2E City at all.
          for f in dev-admin-seed dev-customer-seed dev-provider-seed \
                   dev-category-city-mapping-seed dev-provider-e2e-capacity-seed; do
            echo "--- $f"
            psql "$PGURL" -v ON_ERROR_STOP=1 -f "database/seed/$f.sql"
          done

      - name: Start consumer-api, admin-api and provider-api
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          set -e
          dotnet run --project backend/consumer-api/ConsumerApi --no-build --configuration Release --urls http://localhost:5257 > consumer-api.log 2>&1 &
          dotnet run --project backend/admin-api/AdminApi       --no-build --configuration Release --urls http://localhost:5177 > admin-api.log 2>&1 &
          dotnet run --project backend/provider-api/ProviderApi --no-build --configuration Release --urls http://localhost:5337 > provider-api.log 2>&1 &

          for url in http://localhost:5257/health/ready http://localhost:5177/health/ready http://localhost:5337/health/ready; do
            echo "Waiting for $url ..."
            for i in $(seq 1 60); do
              if curl -sf "$url" >/dev/null; then echo "$url is ready"; break; fi
              if [ "$i" -eq 60 ]; then
                echo "$url did not become ready in time"
                cat consumer-api.log admin-api.log provider-api.log
                exit 1
              fi
              sleep 2
            done
          done

      - name: Install ${{ matrix.app }} dependencies
        working-directory: frontend/${{ matrix.app }}
        run: npm ci

      - name: Install Chromium
        working-directory: frontend/${{ matrix.app }}
        run: npx playwright install --with-deps chromium

      - name: Build and start ${{ matrix.app }}
        working-directory: frontend/${{ matrix.app }}
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5257
        run: |
          set -e
          npm run build
          npm run start > web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:${{ matrix.port }}/ >/dev/null; then
              echo "${{ matrix.app }} is ready"; break
            fi
            if [ "$i" -eq 60 ]; then
              echo "${{ matrix.app }} did not become ready in time"; cat web.log; exit 1
            fi
            sleep 2
          done

      - name: Run Playwright suite
        working-directory: frontend/${{ matrix.app }}
        run: npm run test:e2e

      - name: Why did it fail - was the database even bookable?
        # Task #389's probe, as a post-failure diagnostic rather than a
        # pre-flight gate. It cannot be a gate: each suite's own Playwright
        # `globalSetup` is what seeds the catalog and geography, so the
        # database is legitimately NOT bookable until the test command itself
        # has started. (Verified the hard way - as a pre-run step this failed
        # on a correctly seeded CI database.) After a failure it is the single
        # most useful line in the log: it separates "the app is broken" from
        # "the database could never have served this booking", which otherwise
        # surfaces as a misleading locator timeout deep inside a spec.
        if: failure()
        run: |
          curl -s http://localhost:5257/health/bootstrap | python3 -m json.tool || true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.app }}
          path: |
            frontend/${{ matrix.app }}/test-results
            frontend/${{ matrix.app }}/playwright-report
          retention-days: 14
          if-no-files-found: ignore

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7

      - name: Build consumer-api image
        run: docker build -f backend/consumer-api/ConsumerApi/Dockerfile -t nestly/consumer-api:ci .

      - name: Build admin-api image
        run: docker build -f backend/admin-api/AdminApi/Dockerfile -t nestly/admin-api:ci .
