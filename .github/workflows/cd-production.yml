name: CD - Production

# Continuous deployment to the production environment.
#
# Trigger: every push to `main` (docs/DEVOPS.md CD PIPELINE §3: "Deploy to
# Production from main with manual approval").
#
# Actual app deployment is handled by Render, which is connected directly to
# this repo and builds/deploys the three API Dockerfiles itself on every push
# to main - this workflow does NOT build, push, or deploy container images
# (there is no GHCR step and no self-hosted VM). Its only remaining job is
# the one thing Render's own pipeline cannot do: apply EF Core migrations to
# the production database (Neon) as an explicit, ordered step (docs/
# DEVOPS.md CD PIPELINE §4 / DATABASE OPERATIONS: "Migrations run as a
# separate deployment step, not implicitly at app startup in Production").
#
# Known ordering gap: Render deploys independently and in parallel with this
# workflow - both are triggered by the same push, neither waits on the
# other - so there is no hard guarantee migrations finish before Render's
# new app instances start serving traffic. If that ever causes a real
# problem, the mitigation already exists and is off by default:
# Migrations:ApplyOnStartup (see backend/shared/Infrastructure/Persistence/
# Migrations/StartupMigrationExtensions.cs) - a heavier hammer (needs a
# restart, unsafe with more than one replica racing) and intentionally not
# the default.
#
# Manual approval is a GitHub Environment *protection rule*, not something
# expressible purely in workflow YAML. The `migrate` job below uses
# `environment: production`, which is what makes GitHub honor that
# protection rule once it exists - but the rule itself must be configured in
# the repo UI/API:
#   Settings > Environments > production > Required reviewers > (add the
#   approver(s)). Until that is configured, `environment: production` has no
#   gating effect by itself.
#
# Required setup:
#   1. Create a GitHub Environment named `production` (Settings > Environments).
#   2. Under that environment, add Required reviewers (manual approval gate).
#   3. Add this secret on that environment:
#        PRODUCTION_DATABASE_CONNECTION_STRING   Npgsql connection string for
#                                                 the production Neon database.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  test:
    name: Build & test gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nestly_test
          POSTGRES_USER: nestly
          POSTGRES_PASSWORD: nestly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nestly -d nestly_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Nestly.sln

      - name: Build
        run: dotnet build Nestly.sln --no-restore --configuration Release /warnaserror

      - name: Test
        env:
          ConnectionStrings__Database: Host=localhost;Port=5432;Database=nestly_test;Username=nestly;Password=nestly_test
        # ConcurrentSlotBookingLoadTests needs its own dedicated Postgres
        # service (nestly_loadtest/nestly_loadtest - see ci.yml's `load-test`
        # job), not this job's nestly_test one, so PostgresPerfTestDatabase's
        # connection fails authentication here every time. ci.yml's `backend`
        # job already excludes it for exactly this reason; this job was
        # missing the same filter, which is what has been failing this gate
        # on every run regardless of what changed in the pushed commit.
        run: |
          dotnet test Nestly.sln --no-build --configuration Release --verbosity normal \
            --filter "FullyQualifiedName!~ConcurrentSlotBookingLoadTests"

  migrate:
    name: Apply database migrations (production)
    needs: test
    runs-on: ubuntu-latest
    # environment: production gates this job on Required reviewers too (once
    # configured) - migrations are a production-impacting change in their
    # own right and must not run unapproved.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dotnet-ef (local tool)
        # The repo pins dotnet-ef as a *local* tool (.config/dotnet-tools.json),
        # so a global install is ignored - `dotnet ef` still refuses to run
        # ("Run 'dotnet tool restore'...") until the manifest is restored.
        run: dotnet tool restore

      - name: Apply EF Core migrations to production
        # Same script as staging and local dev - see
        # database/scripts/apply-migrations.sh.
        run: bash database/scripts/apply-migrations.sh "${{ secrets.PRODUCTION_DATABASE_CONNECTION_STRING }}"
