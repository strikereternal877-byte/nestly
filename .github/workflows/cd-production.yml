name: CD - Production

# Continuous deployment to the production environment.
#
# Trigger: every push to `main` (docs/DEVOPS.md CD PIPELINE §3: "Deploy to
# Production from main with manual approval").
#
# Manual approval is a GitHub Environment *protection rule*, not something
# expressible purely in workflow YAML. The `deploy` (and `migrate`) jobs
# below use `environment: production`, which is what makes GitHub honor that
# protection rule once it exists - but the rule itself must be configured in
# the repo UI/API:
#   Settings > Environments > production > Required reviewers > (add the
#   approver(s)). Until that is configured, `environment: production` has no
#   gating effect by itself - this is expected and documented here rather
#   than faked with a workflow-level manual-approval hack (e.g. an
#   `issue_ops`-style approval-via-comment workaround), since GitHub's own
#   environment protection is the standard, conventional mechanism for this
#   and this repo already targets GitHub as its CI/CD platform.
#
# Everything else mirrors cd-staging.yml (see that file's header for the
# fuller rationale on the self-contained build/test gate, GHCR as the
# registry-of-choice, and the SSH+docker-compose deploy shape) - only the
# branch, environment name, image tag prefix and secret names differ.
#
# Required setup before the first real run:
#   1. Create a GitHub Environment named `production` (Settings > Environments).
#   2. Under that environment, add Required reviewers (manual approval gate).
#   3. Add these secrets on that environment:
#        PRODUCTION_DATABASE_CONNECTION_STRING
#        PRODUCTION_REDIS_CONNECTION_STRING
#        PRODUCTION_SSH_HOST
#        PRODUCTION_SSH_USER
#        PRODUCTION_SSH_PRIVATE_KEY
#   4. Ensure <PRODUCTION_SSH_HOST>:/opt/nestly exists, is writable by
#      PRODUCTION_SSH_USER, and has a provisioned .env with runtime secrets
#      (same convention as staging - see deploy/docker-compose.deploy.yml).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  IMAGE_TAG: production-${{ github.sha }}

jobs:
  test:
    name: Build & test gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nestly_test
          POSTGRES_USER: nestly
          POSTGRES_PASSWORD: nestly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nestly -d nestly_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Nestly.sln

      - name: Build
        run: dotnet build Nestly.sln --no-restore --configuration Release /warnaserror

      - name: Test
        env:
          ConnectionStrings__Database: Host=localhost;Port=5432;Database=nestly_test;Username=nestly;Password=nestly_test
        run: dotnet test Nestly.sln --no-build --configuration Release --verbosity normal

  build-and-push:
    name: Build & push images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: consumer-api
            dockerfile: backend/consumer-api/ConsumerApi/Dockerfile
          - service: admin-api
            dockerfile: backend/admin-api/AdminApi/Dockerfile
          - service: provider-api
            dockerfile: backend/provider-api/ProviderApi/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:production-latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  migrate:
    name: Apply database migrations (production)
    needs: build-and-push
    runs-on: ubuntu-latest
    # environment: production gates this job on Required reviewers too (once
    # configured) - migrations are a production-impacting change in their
    # own right and must not run unapproved, independent of the deploy job.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 8.*

      - name: Apply EF Core migrations to production
        # Explicit, ordered deployment step, run before the app deploy step
        # below so new code never starts against an old schema (docs/
        # DEVOPS.md CD PIPELINE §4 / DATABASE OPERATIONS). Same script as
        # staging and local dev - see database/scripts/apply-migrations.sh.
        run: bash database/scripts/apply-migrations.sh "${{ secrets.PRODUCTION_DATABASE_CONNECTION_STRING }}"

  deploy:
    name: Deploy to production
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.PRODUCTION_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship deploy manifest to production host
        run: |
          scp -i ~/.ssh/deploy_key deploy/docker-compose.deploy.yml \
            "${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}:/opt/nestly/docker-compose.yml"

      - name: Pull and recreate containers
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}" bash -s <<EOF
            set -euo pipefail
            cd /opt/nestly
            export CONSUMER_API_IMAGE=ghcr.io/${{ github.repository }}/consumer-api:${{ env.IMAGE_TAG }}
            export ADMIN_API_IMAGE=ghcr.io/${{ github.repository }}/admin-api:${{ env.IMAGE_TAG }}
            export PROVIDER_API_IMAGE=ghcr.io/${{ github.repository }}/provider-api:${{ env.IMAGE_TAG }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          EOF
