name: Rollback

# Manually-triggered database rollback, to either the staging or production
# environment (docs/DEVOPS.md CD PIPELINE §5: "Support rollback to the
# previous image version").
#
# Application-level rollback is no longer this workflow's job: Render
# deploys the three APIs directly from this repo's Dockerfiles (see
# cd-production.yml/cd-staging.yml headers) and keeps its own deploy
# history - rolling back the app means using Render's dashboard (or its
# API) to redeploy a previous successful deploy, same for Vercel on the
# frontends. There is no GHCR image tag or SSH host for this workflow to
# redeploy to anymore. What Render/Vercel cannot do for you is touch the
# database, so that remains here.
#
# `environment: ${{ inputs.environment }}` below resolves to `staging` or
# `production` at run time, so rolling back production still goes through
# the same Required-reviewers approval gate as a normal production deploy
# (once that protection rule is configured per cd-production.yml's header
# comment) - a rollback is a production change like any other and must not
# bypass approval.
#
# --- Read this before using target_migration ---
#
# EF Core migrations CAN have a Down() method and `dotnet ef database
# update <PreviousMigrationName>` genuinely reverts schema changes - this is
# real, not fabricated. But it is only safe when every migration between the
# current and target one has a *lossless, reversible* Down() (e.g. adding a
# nullable column, adding an index). It is NOT safe, and this workflow does
# not attempt to make it safe, when a migration in between:
#   - dropped a column or table (Down() would have to fabricate data that no
#     longer exists - EF cannot recover it)
#   - changed a column's type in a lossy way
#   - is still relied upon by the app version currently live (roll back the
#     Render/Vercel deploy to a version that predates the migration you're
#     reverting *before* running this, not after - the app must never be
#     newer than the schema it expects)
#
# Only run this when you have specifically verified every intervening
# Down() is safe to run against real data; it runs the target migration
# verbatim via `dotnet ef database update <target_migration>` and will not
# second-guess your choice. If you just need to undo a bad app deploy and
# the schema itself is fine, you don't need this workflow at all - use
# Render's/Vercel's own rollback instead.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        required: true
        type: choice
        options:
          - staging
          - production
      target_migration:
        description: >-
          Name of a specific prior EF Core migration to roll the database
          back to (e.g. 20260730151925_AddGeographySchema). Only set this if
          you have verified every intervening migration's Down() is safe -
          see this workflow's header comment.
        required: true
        type: string

concurrency:
  group: cd-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback-database:
    name: Roll back database
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dotnet-ef (local tool)
        # The repo pins dotnet-ef as a *local* tool (.config/dotnet-tools.json),
        # so a global install is ignored - `dotnet ef` still refuses to run
        # ("Run 'dotnet tool restore'...") until the manifest is restored.
        run: dotnet tool restore

      - name: Roll back to ${{ inputs.target_migration }}
        env:
          CONNECTION: ${{ inputs.environment == 'production' && secrets.PRODUCTION_DATABASE_CONNECTION_STRING || secrets.STAGING_DATABASE_CONNECTION_STRING }}
        run: |
          dotnet ef database update "${{ inputs.target_migration }}" \
            --project backend/shared/Infrastructure \
            --startup-project backend/consumer-api/ConsumerApi \
            --connection "$CONNECTION"
