name: CD - Staging

# Continuous deployment to the staging environment.
#
# Trigger: every push to `develop` (docs/DEVOPS.md CD PIPELINE §2: "Deploy to
# Staging automatically from develop").
#
# This workflow no longer builds, pushes, or deploys container images -
# production (cd-production.yml) is deployed by Render, which builds
# directly from this repo's Dockerfiles on push and needs no GHCR image or
# SSH+docker-compose step from GitHub Actions. Staging never had a real,
# reachable SSH host either (this workflow had zero runs before this
# change - the previous GHCR/SSH deploy jobs here were exercising
# infrastructure that was never actually provisioned), so the same shape is
# used here for consistency: this workflow's only job is the one thing no
# PaaS auto-deploy does for you - applying EF Core migrations to the staging
# database as an explicit, ordered step (docs/DEVOPS.md CD PIPELINE §4 /
# DATABASE OPERATIONS).
#
# If staging ends up on a different platform than Render (or on a real VM
# after all), reintroduce a deploy job here mirroring however that platform
# is actually driven - don't restore the old SSH/GHCR shape blind, it was
# never verified against a real host.
#
# Required setup:
#   1. Create a GitHub Environment named `staging` (Settings > Environments).
#   2. Add this secret on that environment:
#        STAGING_DATABASE_CONNECTION_STRING   Npgsql connection string for
#                                              the staging Postgres database.

on:
  push:
    branches: [develop]
  workflow_dispatch: {}

concurrency:
  group: cd-staging
  cancel-in-progress: false

jobs:
  test:
    name: Build & test gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nestly_test
          POSTGRES_USER: nestly
          POSTGRES_PASSWORD: nestly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nestly -d nestly_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Nestly.sln

      - name: Build
        run: dotnet build Nestly.sln --no-restore --configuration Release /warnaserror

      - name: Test
        env:
          ConnectionStrings__Database: Host=localhost;Port=5432;Database=nestly_test;Username=nestly;Password=nestly_test
        # ConcurrentSlotBookingLoadTests needs its own dedicated Postgres
        # service (nestly_loadtest/nestly_loadtest - see ci.yml's `load-test`
        # job), not this job's nestly_test one, so PostgresPerfTestDatabase's
        # connection fails authentication here every time. ci.yml's `backend`
        # job already excludes it for exactly this reason; this job was
        # missing the same filter.
        run: |
          dotnet test Nestly.sln --no-build --configuration Release --verbosity normal \
            --filter "FullyQualifiedName!~ConcurrentSlotBookingLoadTests"

  migrate:
    name: Apply database migrations (staging)
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dotnet-ef (local tool)
        # The repo pins dotnet-ef as a *local* tool (.config/dotnet-tools.json),
        # so a global install is ignored - `dotnet ef` still refuses to run
        # ("Run 'dotnet tool restore'...") until the manifest is restored.
        run: dotnet tool restore

      - name: Apply EF Core migrations to staging
        # Reuses the same script a developer would run locally
        # (database/scripts/apply-migrations.sh) so there is exactly one
        # code path for "how do migrations get applied", not a second
        # CI-only one.
        run: bash database/scripts/apply-migrations.sh "${{ secrets.STAGING_DATABASE_CONNECTION_STRING }}"
